apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: apps.platform.upbound.io
spec:
  group: platform.upbound.io
  names:
    categories:
    - crossplane
    kind: App
    plural: apps
  scope: Namespaced
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: App is the Schema for the App API.
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                description: App configuration parameters.
                properties:
                  managementPolicies:
                    description: ManagementPolicies for AWS EC2 resources. Defaults to ["*"] which includes all operations (Create, Observe, Update, Delete, LateInitialize). To orphan resources on deletion, use ["Create", "Observe", "Update", "LateInitialize"].
                    type: array
                    items:
                      type: string
                      enum:
                        - "*"
                        - Create
                        - Observe
                        - Update
                        - Delete
                        - LateInitialize
                      default: "*"
                  providerConfigName:
                    description: Crossplane ProviderConfig to use for provisioning this resources
                    type: string
                    default: "default"
                  helm:
                    type: object
                    description: Configuration for operators.
                    properties:
                      chart:
                        type: object
                        description: Configuration for the Helm Chart
                        properties:
                          name:
                            type: string
                            description: chart name
                          repo:
                            type: string
                            description: chart repo
                          version:
                            type: string
                            description: chart version
                      values:
                        type: object
                        description: Values for the Helm Chart
                        x-kubernetes-preserve-unknown-fields: true
                      wait:
                        type: boolean
                        default: True
                        description: |
                          Whether to wait or not for resources to be healthy or deleted when installing
                          or deleting the chart
                  passwordSecretRef:
                    type: object
                    description: "A reference to the Secret object containing database credentials"
                    properties:
                      namespace:
                        type: string
                      name:
                        type: string
                    required:
                      - namespace
                      - name
                required:
                  - providerConfigName
